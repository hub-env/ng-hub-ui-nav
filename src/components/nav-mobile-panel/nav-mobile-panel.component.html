@if (isOpen()) {
	<!-- Backdrop (offcanvas and fullscreen modes) -->
	@if (mode() !== 'dropdown') {
		<div class="hub-nav-mobile-panel__backdrop" (click)="onBackdropClick()"></div>
	}

	<!-- Panel content -->
	<div class="hub-nav-mobile-panel__content">
		<!-- Close button -->
		<div class="hub-nav-mobile-panel__header">
			<button type="button" class="hub-nav-mobile-panel__close" [attr.aria-label]="closeLabel()" (click)="onCloseClick()">
				<span aria-hidden="true">&times;</span>
			</button>
		</div>

		<!-- Start slot (brand / header) — mirrors the desktop nav -->
		@if (startTemplate()) {
			<div class="hub-nav-slot hub-nav-slot--start hub-nav-mobile-panel__start">
				<ng-container [ngTemplateOutlet]="startTemplate()!" [ngTemplateOutletContext]="slotContext" />
			</div>
		}

		<!-- Navigation items in vertical accordion mode -->
		<div class="hub-nav-mobile-panel__body">
			<hub-nav-item-list
				[items]="items()"
				[depth]="0"
				[forceAccordionMode]="true"
				[itemTemplate]="itemTemplate()"
				(itemClick)="onItemClick($event)"
				(dropdownToggle)="onDropdownToggle($event)"
			/>
		</div>

		<!-- End slot (footer) — anchored to the bottom, mirrors the desktop nav -->
		@if (endTemplate()) {
			<div class="hub-nav-slot hub-nav-slot--end hub-nav-mobile-panel__end">
				<ng-container [ngTemplateOutlet]="endTemplate()!" [ngTemplateOutletContext]="slotContext" />
			</div>
		}
	</div>
}
